services:
  - type: web
    name: retrievo-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8085
      - key: SPRING_PROFILES_ACTIVE
        value: mysql
      - key: DB_URL
        value: jdbc:mysql://localhost:3306/retrievo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        value: gayathri
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: uploads
