server:
  port: ${PORT:8085}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: retrievo-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/retrievo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# Custom Retrievo Config
retrievo:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  upload:
    dir: ${UPLOAD_DIR:uploads}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:5000}
    matching-threshold: 0.60
